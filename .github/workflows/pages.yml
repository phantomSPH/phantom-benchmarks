name: pages

# builds the benchmark website from the results committed in results/ and deploys to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ 'results/**', 'scripts/report.py', '.github/workflows/pages.yml' ]
  workflow_dispatch:
  # called by the benchmarks workflow after committing results
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# do not cancel a deployment in progress, but skip runs queued behind it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # separate build and deploy jobs, so a failed deployment can be re-run
  # without uploading a second copy of the site
  build:
    runs-on: ubuntu-latest
    steps:
      # latest default branch, so that results committed earlier in a calling workflow are included
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install matplotlib
      # phantom history only (no files), to order the results by phantom version
      - run: git clone --filter=blob:none --no-checkout https://github.com/danieljprice/phantom phantom-history
      - run: PHANTOM_DIR=$PWD/phantom-history ./phantombench site site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
