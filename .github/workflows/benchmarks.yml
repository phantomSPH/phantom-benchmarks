name: benchmarks

# Runs the benchmark suite on GitHub-hosted runners, one job per benchmark, with each job
# building and running every compiler in turn on the same machine. Results are committed to
# results/github-ubuntu/ and the website is rebuilt.
#
# Hosted runners are shared virtual machines (4 cores, variable cpu model), so these results
# check correctness and compare compilers, but are not precise timings.
#
# Triggered manually, or by phantom (danieljprice/phantom) on every push to main via a
# repository_dispatch event of type "phantom-push" with client_payload.sha. Run manually with a
# list of phantom versions to fill in the history of past versions, e.g.
#   gh workflow run benchmarks -f phantom_ref="$(git -C ~/phantom log --format=%h -10 main | xargs)"

on:
  workflow_dispatch:
    inputs:
      phantom_ref:
        description: 'phantom versions to benchmark (branches, tags or commits, separated by spaces)'
        default: 'main'
      systems:
        description: 'phantom SYSTEMs (compilers) to test'
        default: 'gfortran ifx aocc nvfortran'
      benchmarks:
        description: 'benchmarks to run (blank = all in tier)'
        default: ''
      tier:
        description: 'tier of benchmarks to run'
        type: choice
        options: [ quick, all ]
        default: quick
  repository_dispatch:
    types: [ phantom-push ]

# one run at a time; a burst of pushes to phantom collapses into a single queued run
concurrency:
  group: benchmarks
  cancel-in-progress: false

env:
  PHANTOM_REF: ${{ github.event.client_payload.sha || inputs.phantom_ref || 'main' }}
  SYSTEMS: ${{ inputs.systems || 'gfortran ifx aocc nvfortran' }}
  PHANTOMBENCH_MACHINE: github-ubuntu

jobs:

  list:
    runs-on: ubuntu-latest
    outputs:
      benchmarks: ${{ steps.list.outputs.benchmarks }}
      refs: ${{ steps.list.outputs.refs }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          BENCHMARKS: ${{ inputs.benchmarks }}
          TIER: ${{ inputs.tier || 'quick' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # benchmarks requested, or all those in the requested tier
          if [ -z "$BENCHMARKS" ]; then
             for dir in benchmarks/*/; do
                name=$(basename $dir)
                if [ "$TIER" == "all" ] || [ "$(cat $dir/TIER)" == "$TIER" ]; then BENCHMARKS+=" $name"; fi
             done
          fi
          echo "benchmarks=$(echo $BENCHMARKS | jq -cR 'split(" ")')" >> $GITHUB_OUTPUT
          # phantom versions (branches, tags or abbreviated hashes) as full commit hashes, which is
          # what the checkout needs, with the name given for each; one job each per benchmark
          refs=""
          for ref in $PHANTOM_REF; do
             sha=$(gh api repos/danieljprice/phantom/commits/$ref --jq .sha) || \
                { echo "::error::phantom version $ref not found"; exit 1; }
             refs+="{\"name\":\"$ref\",\"sha\":\"$sha\"},"
          done
          echo "refs=[${refs%,}]" >> $GITHUB_OUTPUT

  bench:
    needs: list
    strategy:
      fail-fast: false
      matrix:
        bench: ${{ fromJson(needs.list.outputs.benchmarks) }}
        ref: ${{ fromJson(needs.list.outputs.refs) }}
    name: ${{ matrix.bench }} (${{ matrix.ref.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PHANTOM_DIR: ${{ github.workspace }}/phantom
      PHANTOMBENCH_RESULTS: ${{ github.workspace }}/new-results
      OMP_NUM_THREADS: 4
      OMP_STACKSIZE: 1024m
      OMP_SCHEDULE: dynamic
      RETURN_ERR: 'yes'
    steps:
      - uses: actions/checkout@v7

      - name: checkout phantom
        id: phantom
        uses: actions/checkout@v7
        with:
          repository: danieljprice/phantom
          ref: ${{ matrix.ref.sha }}
          path: phantom

      - name: free disk space for compilers
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup

      - name: cache benchmark data
        uses: actions/cache@v6
        with:
          path: ~/.cache/phantombench/${{ matrix.bench }}
          key: phantombench-${{ matrix.bench }}-${{ hashFiles(format('benchmarks/{0}/.hashlist', matrix.bench)) }}

      # one step per compiler, each installed just before it is used, since installing a
      # compiler can change the environment (e.g. LIBRARY_PATH) seen by those installed before it.
      # gfortran is already on the runner; same compiler mapping as phantom's build.yml.
      # Later compilers run even if an earlier one fails (!cancelled), but only if phantom was checked out
      - name: gfortran
        if: ${{ !cancelled() && steps.phantom.outcome == 'success' && contains(env.SYSTEMS, 'gfortran') }}
        run: SYSTEM=gfortran PHANTOMBENCH_LABEL=gfortran ./scripts/run-benchmarks.sh ${{ matrix.bench }}

      - name: install ifx
        if: ${{ !cancelled() && steps.phantom.outcome == 'success' && contains(env.SYSTEMS, 'ifx') }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
      - name: ifx
        if: ${{ !cancelled() && steps.phantom.outcome == 'success' && contains(env.SYSTEMS, 'ifx') }}
        run: SYSTEM=ifx PHANTOMBENCH_LABEL=ifx ./scripts/run-benchmarks.sh ${{ matrix.bench }}

      - name: install aocc
        if: ${{ !cancelled() && steps.phantom.outcome == 'success' && contains(env.SYSTEMS, 'aocc') }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: aocc
      - name: aocc
        if: ${{ !cancelled() && steps.phantom.outcome == 'success' && contains(env.SYSTEMS, 'aocc') }}
        run: SYSTEM=aocc PHANTOMBENCH_LABEL=aocc ./scripts/run-benchmarks.sh ${{ matrix.bench }}

      - name: install nvfortran
        if: ${{ !cancelled() && steps.phantom.outcome == 'success' && contains(env.SYSTEMS, 'nvfortran') }}
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: nvidia-hpc
      - name: nvfortran
        if: ${{ !cancelled() && steps.phantom.outcome == 'success' && contains(env.SYSTEMS, 'nvfortran') }}
        run: SYSTEM=nvfortran PHANTOMBENCH_LABEL=nvfortran ./scripts/run-benchmarks.sh ${{ matrix.bench }}

      - name: summary
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/report.py --results $PHANTOMBENCH_RESULTS --reports $RUNNER_TEMP/reports \
             --machine $PHANTOMBENCH_MACHINE ${{ matrix.bench }} | sed -n '/^|/p' | tee -a $GITHUB_STEP_SUMMARY

      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.bench }}-${{ strategy.job-index }}
          path: ${{ env.PHANTOMBENCH_RESULTS }}
          if-no-files-found: ignore

      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.bench }}-${{ strategy.job-index }}
          path: |
            runs/${{ matrix.bench }}/*/*.log
            runs/${{ matrix.bench }}/*/build-*/make-*.log

  commit:
    needs: bench
    if: always() && needs.bench.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: new

      - name: append results and commit
        run: |
          # append new rows, keeping the header only if the file is new
          # (artifacts may or may not keep the machine subdirectory, so search for them)
          for csv in $(find new -name '*.csv'); do
             out=results/$PHANTOMBENCH_MACHINE/$(basename $csv)
             mkdir -p $(dirname $out)
             if [ -e $out ]; then
                # use the new header if columns have been added since the file was written
                (head -1 $csv; tail -n +2 $out; tail -n +2 $csv) > $out.tmp && mv $out.tmp $out
             else
                cp $csv $out
             fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet && { echo "no new results"; exit 0; }
          git commit -m "results: GitHub Actions run ${{ github.run_id }} (phantom $PHANTOM_REF)"
          for attempt in 1 2 3; do
             git push && exit 0
             git pull --rebase
          done
          exit 1

  pages:
    needs: commit
    # update the site whenever results were committed, even if some benchmarks failed
    if: always() && needs.commit.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
